<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Finance Control — Aplicativo de Gestão Financeira Pessoal.">
  <meta name="theme-color" content="#0F766E">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance Control">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Finance Control</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #070E1E;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at center, #0F3534 0%, #070E1E 68%);
      transition: opacity 0.28s ease-out;
    }

    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #splash-logo {
      width: 108px;
      height: 108px;
      border-radius: 26px;
      box-shadow: 0 12px 36px rgba(20, 184, 166, 0.22);
    }

    #splash-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #F8FAFC;
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="splash-screen" aria-hidden="true">
    <img id="splash-logo" src="icons/Icon-192.png" alt="Finance Control" />
    <div id="splash-title">Finance Control</div>
  </div>

  <script>
    function hideSplash() {
      const splash = document.getElementById('splash-screen');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(() => splash.remove(), 320);
    }

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            hideSplash();
          });
        }
      });
    });
  </script>
</body>
</html>
